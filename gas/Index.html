<!DOCTYPE html>
<html lang="ja">
<head>
<base target="_top">
<meta charset="utf-8">
<title>JARVIS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#02090f;--panel:rgba(4,22,32,.78);--main:#5fdcff;--band:#1c86bd;--accent:#ffb02e;--ink:#d6f4ff;--muted:#8fb3c6;--line:rgba(95,220,255,.34);--rgb:95,220,255;--core:rgba(3,20,30,.94);--bd:288 654.5;--ad:74 717.7}
[data-char="friday"]{--bg:#0b0504;--panel:rgba(28,13,8,.78);--main:#ff8a1f;--band:#e4600a;--accent:#3fc4a6;--ink:#ffe9d6;--muted:#d1ad96;--line:rgba(255,138,31,.38);--rgb:255,138,31;--core:rgba(20,8,4,.94);--bd:524 418.5;--ad:132 659.7}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Noto Sans JP",sans-serif}
body{background:radial-gradient(ellipse at 50% 45%,rgba(var(--rgb),.16),transparent 62%),var(--bg);background-attachment:fixed}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background-image:linear-gradient(rgba(var(--rgb),.04) 1px,transparent 1px),linear-gradient(90deg,rgba(var(--rgb),.04) 1px,transparent 1px);background-size:36px 36px}
.orb{font-family:"Orbitron","Zen Maru Gothic",sans-serif}
#app{position:relative;min-height:100vh;display:flex;flex-direction:column;gap:6px;padding:8px}
#stage{display:grid;gap:6px;height:calc(100vh - 196px);min-height:560px;grid-template-columns:repeat(16,minmax(0,1fr));grid-template-rows:repeat(10,minmax(0,1fr));
  grid-template-areas:
  "bd bd bd lu lu ck ck ck dt dt dt wk wk wk wk wk"
  "bd bd bd lu lu rg rg rg rg rg rg wk wk wk wk wk"
  "bd bd bd lu lu rg rg rg rg rg rg wk wk wk wk wk"
  "ds ds ds ds ds rg rg rg rg rg rg st st wx wx wx"
  "ds ds ds ds ds rg rg rg rg rg rg st st wx wx wx"
  "sc sc sc td td rg rg rg rg rg rg ca ca ca yp yp"
  "sc sc sc td td rg rg rg rg rg rg ca ca ca yp yp"
  "ml ml ch ch ch rg rg rg rg rg rg gm gm gm nw nw"
  "ml ml ch ch ch tk tk tk tk tk tk gm gm gm nw nw"
  "ml ml ch ch ch tk tk tk tk tk tk gm gm gm nw nw"}
#P_sc{grid-area:sc}#P_lu{grid-area:lu}#P_ck{grid-area:ck}#P_dt{grid-area:dt}#P_wk{grid-area:wk}
#P_ds{grid-area:ds}#P_st{grid-area:st}#P_sy{grid-area:sy}#P_wx{grid-area:wx}
#P_yp{grid-area:yp}#P_ca{grid-area:ca}
#P_ml{grid-area:ml}#P_ch{grid-area:ch}#P_bd{grid-area:bd}#P_td{grid-area:td}#P_gm{grid-area:gm}#P_nw{grid-area:nw}
#ringBox{grid-area:rg;min-height:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
svg.hud{width:100%;height:100%;max-height:100%}
#talk{grid-area:tk;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-size:14px;line-height:1.6;padding:2px 10px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);overflow:hidden;background:linear-gradient(90deg,transparent,rgba(var(--rgb),.08),transparent)}
.ring{fill:none;stroke:var(--main)}
.r{transform-box:fill-box;transform-origin:center}
.r1{animation:spin 120s linear infinite}.r2{animation:spin 70s linear infinite reverse}
.r3{animation:spin 45s linear infinite}.r4{animation:spin 30s linear infinite reverse}.r5{animation:spin 60s linear infinite}
.speaking .r3{animation-duration:9s}.speaking .r4{animation-duration:6s}.speaking .r5{animation-duration:12s}
@keyframes spin{to{transform:rotate(360deg)}}
#state{font-size:11px;fill:var(--main)}

.panel{position:relative;min-width:0;min-height:0;overflow:hidden;border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:7px 10px 8px;cursor:pointer;user-select:none;-webkit-user-select:none;box-shadow:0 0 0 1px rgba(var(--rgb),.05) inset,0 0 14px rgba(var(--rgb),.1);animation:breathe 6s ease-in-out infinite alternate}
.panel:nth-child(3n){animation-delay:-2s}.panel:nth-child(3n+1){animation-delay:-4s}
@keyframes breathe{from{box-shadow:0 0 0 1px rgba(var(--rgb),.05) inset,0 0 10px rgba(var(--rgb),.08)}to{box-shadow:0 0 0 1px rgba(var(--rgb),.12) inset,0 0 20px rgba(var(--rgb),.22)}}
.panel::before,.panel::after{content:"";position:absolute;width:10px;height:10px;border:2px solid var(--main);pointer-events:none}
.panel::before{left:-1px;top:-1px;border-right:0;border-bottom:0;border-top-left-radius:8px}
.panel::after{right:-1px;bottom:-1px;border-left:0;border-top:0;border-bottom-right-radius:8px}
.panel:hover{border-color:var(--main)}
.panel .x{display:none}
.panel.zoom{position:fixed;z-index:40;animation:none;cursor:default;max-height:84vh;overflow:auto;padding:18px 22px 20px;border-radius:16px;background:rgba(2,12,18,.94);box-shadow:0 0 60px rgba(var(--rgb),.35)}
[data-char="friday"] .panel.zoom{background:rgba(16,7,4,.95)}
.panel.zoom.go{transition:left .36s cubic-bezier(.2,.8,.2,1),top .36s cubic-bezier(.2,.8,.2,1),width .36s cubic-bezier(.2,.8,.2,1)}
.panel.zoom .x{display:block;position:absolute;right:10px;top:8px;width:40px;height:40px;min-height:0;padding:0;border-radius:50%;font-size:16px}
.panel.zoom .ph{font-size:16px;padding-right:44px}
.panel.zoom .row,.panel.zoom .muted{font-size:15px}
.more{display:none}
.panel.zoom .more{display:block;margin-top:12px;padding-top:10px;border-top:1px dashed var(--line)}
#veil{position:fixed;inset:0;z-index:30;background:rgba(0,4,8,.7);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .3s}
#veil.on{opacity:1;pointer-events:auto}
.ph{margin:0 0 4px;font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--main);display:flex;justify-content:space-between;align-items:baseline;gap:6px;white-space:nowrap}
.ph span{font-family:"Orbitron",sans-serif;font-size:8px;font-weight:500;letter-spacing:.16em;color:var(--muted)}
.row{display:flex;gap:8px;align-items:baseline;padding:2px 0;border-bottom:1px solid rgba(var(--rgb),.14);font-size:12px;line-height:1.45}
.row:last-child{border-bottom:0}
.row b.ok,.row b.ng{min-width:14px}
.row b{flex:none;min-width:46px;font-family:"Orbitron",sans-serif;font-size:10px;font-weight:500;color:var(--main)}
.muted{color:var(--muted);font-size:11px;line-height:1.5}
.big{font-family:"Orbitron",sans-serif;font-size:30px;color:var(--main);line-height:1.05}
.mid{font-family:"Orbitron",sans-serif;font-size:18px;color:var(--ink);line-height:1.2}
.grid6{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px}
.panel.zoom .grid6{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.cell{border:1px solid var(--line);border-radius:6px;padding:2px 5px}
.cell small{display:block;font-size:9px;color:var(--muted)}
.cell em{font-style:normal;font-family:"Orbitron",sans-serif;font-size:12px}
.panel.zoom .cell em{font-size:16px}.panel.zoom .cell small{font-size:11px}
.nums{display:flex;justify-content:space-between;gap:4px}
.nums div{text-align:center;flex:1}
.nums .v{font-family:"Orbitron",sans-serif;font-size:19px}
.nums .l{font-size:10px;color:var(--muted)}
.ok{color:var(--main)} .ng{color:var(--accent)}
.bar{height:6px;border-radius:3px;background:rgba(var(--rgb),.18);overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--main);border-radius:3px}
.bars{display:flex;align-items:flex-end;gap:3px;height:100%;min-height:18px}
.bars i{display:block;flex:1;background:var(--main);opacity:.75;animation:barA 2.2s ease-in-out infinite alternate}
@keyframes barA{from{height:15%}to{height:100%}}
.spark{display:flex;align-items:flex-end;gap:2px;height:26px;margin-top:3px}
.spark i{display:block;flex:1;min-width:3px;max-width:12px;background:var(--main);opacity:.8;border-radius:1px}
.weekstrip{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center;font-size:11px}
.weekstrip div{padding:2px 0;border-radius:4px}
.weekstrip .today{background:var(--main);color:var(--bg);font-weight:700}
.weekstrip .w{color:var(--muted);font-size:9px}
.month{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:14px}
.month div{padding:5px 0;border-radius:6px}
.month .today{background:var(--main);color:var(--bg);font-weight:700}
.month .w{color:var(--muted);font-size:11px}
.nohdr{display:flex;align-items:center;justify-content:center;text-align:center}
.orbsm{font-family:"Orbitron",sans-serif}

.badge{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:var(--accent);color:#1a1000;font-family:"Orbitron",sans-serif;font-size:12px;font-weight:700}
.badge.zero{background:transparent;border:1px solid var(--line);color:var(--muted)}
.ph .badge,.ph span.badge{margin-left:auto;margin-right:6px;font-size:12px;letter-spacing:0;color:#1a1000}.ph span.badge.zero{color:var(--muted);font-size:11px}
#b_sy{display:grid;grid-template-columns:1fr 1fr;column-gap:8px}#b_sy .row{font-size:11px}
.panel.zoom #b_sy{grid-template-columns:1fr}
.mi{display:flex;flex-direction:column;gap:0;padding:3px 0;border-bottom:1px solid rgba(var(--rgb),.14);line-height:1.4}
.mi:last-child{border-bottom:0}
.mi .a{font-size:11px;color:var(--main);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mi .b{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mi .c{font-size:10px;color:var(--muted)}
.panel.zoom .mi .b{white-space:normal;font-size:14px}
.panel.zoom .mi .a{font-size:12px}
.lk{display:inline-block;margin-top:8px;color:var(--main);font-size:13px}
.hid{letter-spacing:.2em;color:var(--muted)}
.swipe{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch;touch-action:pan-x}
.swipe::-webkit-scrollbar{display:none}
.sw{flex:0 0 100%;scroll-snap-align:start;min-width:0}
.swn{font-size:14px;font-weight:700;line-height:1.3}
.swd{font-size:11px;color:var(--muted);line-height:1.45;margin-top:2px;max-height:3em;overflow:hidden}
.panel.zoom .swd{max-height:none;font-size:13px}
.swc{display:flex;align-items:center;justify-content:space-between;margin-top:3px;font-size:10px;color:var(--muted)}
.swc button{min-height:22px;height:22px;padding:0 8px;border-radius:11px;font-size:12px}
.ck{flex:none;width:22px;height:22px;min-height:22px;padding:0;border-radius:50%;font-size:12px;line-height:1;color:var(--main)}
.ck.on{background:var(--main);color:var(--bg)}
.td{display:flex;gap:8px;align-items:center;padding:3px 0;border-bottom:1px solid rgba(var(--rgb),.14);font-size:12px;line-height:1.4}
.td:last-child{border-bottom:0}
.td .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.panel.zoom .td .t{white-space:normal;font-size:15px}
.td.done .t{text-decoration:line-through;color:var(--muted)}
.td .due{flex:none;font-size:10px;color:var(--muted)}
.td .due.today{color:var(--accent)}.td .due.over{color:#ff6a6a}
.td .rm{flex:none;min-height:26px;width:26px;padding:0;border-radius:50%;font-size:12px;color:var(--muted)}
.cf{display:flex;gap:8px;justify-content:center;margin-top:6px}
.cf button{min-height:34px;padding:0 18px;border-color:var(--main);color:var(--main)}
.sec{margin:8px 0 2px;font-size:11px;color:var(--main);letter-spacing:.08em}
footer{display:flex;flex-direction:column;gap:6px;position:relative;z-index:3;border-top:1px solid var(--line);padding-top:6px}
#log{font-size:13px;line-height:1.5;min-height:38px}
#log div{display:flex;gap:10px}
#log .w{flex:none;width:58px;font-size:10px;color:var(--muted);padding-top:2px}
#log .you .t{color:var(--muted)}
#log .ai .w{color:var(--main)}
form{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
input[type=text]{flex:1 1 220px;min-width:0;height:44px;padding:0 14px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);font:inherit;font-size:16px}
button,select{min-height:40px;padding:0 14px;border:1px solid var(--line);border-radius:10px;background:transparent;color:var(--ink);font:inherit;font-size:13px;cursor:pointer}
select{max-width:200px;background:var(--bg)}
button.go{width:44px;padding:0;color:var(--main);font-size:18px}
button.on{border-color:var(--main);color:var(--main)}
#hint{margin-left:auto;font-size:11px;color:var(--muted)}
#boot{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;background:var(--bg)}
#boot button{border-color:var(--main);color:var(--main);font-size:16px;padding:0 34px;min-height:52px}
#boot .n{font-size:22px;letter-spacing:.3em}
@media (prefers-reduced-motion:reduce){.r,.panel,.bars i{animation:none}}
@media (max-width:900px){
  #stage{height:auto;min-height:0;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:none;grid-auto-rows:minmax(92px,auto);grid-auto-flow:dense;grid-template-areas:none}
  #stage>*{grid-area:auto !important}
  #ringBox{grid-column:1 / -1 !important;order:-3;height:min(80vw,300px)}
  #talk{grid-column:1 / -1 !important;order:-2;min-height:56px}
  #P_ck,#P_dt,#P_sc,#P_wk,#P_ds,#P_bd,#P_gm,#P_ch,#P_ml,#P_td{grid-column:1 / -1 !important}
  .grid6{grid-template-columns:repeat(3,minmax(0,1fr))}
  .cell em{font-size:15px}
  #P_dt,#P_ck{min-height:64px}
  #hint{display:none}
}
</style>
</head>
<body data-char="jarvis">
<div id="boot">
  <div class="orb n" id="bootName">J.A.R.V.I.S.</div>
  <button type="button" id="bootBtn">起動する</button>
  <div class="muted">タップすると、声も出ます</div>
</div>

<div id="veil"></div>
<div id="app">
  <div id="stage">
    <div id="ringBox">
      <svg class="hud" id="hud" viewBox="0 0 400 400" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
        <circle class="ring" cx="200" cy="200" r="198" style="stroke-opacity:.35"/>
        <g class="r r1"><circle class="ring" cx="200" cy="200" r="190" style="stroke-width:6;stroke-dasharray:1.3 8.65;stroke-opacity:.6"/><circle class="ring" cx="200" cy="200" r="190" style="stroke-width:11;stroke-dasharray:2.2 47.54"/></g>
        <g class="r r2"><circle class="ring" cx="200" cy="200" r="172" style="stroke-width:2;stroke-dasharray:14 5 2 5;stroke-opacity:.5"/></g>
        <g class="r r3">
          <circle cx="200" cy="200" r="150" style="fill:none;stroke:var(--band);stroke-width:22;stroke-opacity:.16"/>
          <circle cx="200" cy="200" r="150" transform="rotate(-90 200 200)" style="fill:none;stroke:var(--band);stroke-width:22;stroke-opacity:.85;stroke-dasharray:var(--bd)"/>
          <circle cx="200" cy="200" r="150" style="fill:none;stroke:var(--bg);stroke-width:26;stroke-dasharray:1.4 6.454"/>
        </g>
        <g class="r r4">
          <circle cx="200" cy="200" r="126" style="fill:none;stroke:var(--accent);stroke-opacity:.22"/>
          <circle cx="200" cy="200" r="126" transform="rotate(-90 200 200)" style="fill:none;stroke:var(--accent);stroke-width:3;stroke-linecap:round;stroke-dasharray:var(--ad)"/>
        </g>
        <g class="r r5"><circle class="ring" cx="200" cy="200" r="112" style="stroke-opacity:.55"/><circle class="ring" cx="200" cy="200" r="112" style="stroke-width:6;stroke-dasharray:1.3 8.47;stroke-opacity:.8"/></g>
        <circle cx="200" cy="200" r="98" style="fill:var(--core);stroke:var(--main);stroke-width:1.6"/>
        <circle class="ring" cx="200" cy="200" r="76" style="stroke-width:12;stroke-dasharray:2.3 5.16;stroke-opacity:.75"/>
        <text id="ringName" x="200" y="198" text-anchor="middle" textLength="104" lengthAdjust="spacingAndGlyphs" style="font-family:Orbitron,sans-serif;font-size:14px;font-weight:700;fill:var(--ink)">J.A.R.V.I.S.</text>
        <text id="state" x="200" y="218" text-anchor="middle">待機中</text>
      </svg>
    </div>
    <div id="talk"></div>
  </div>

  <footer>
    <div id="log"></div>
    <form id="form">
      <input type="text" id="inp" aria-label="メッセージ" placeholder="ご用件をどうぞ（例：連絡 明日は短縮4校時　／　ToDo 提出物 金曜）" autocomplete="off">
      <button type="submit" class="go" aria-label="送信">→</button>
      <button type="button" data-q="今日の予定">今日の予定</button>
      <button type="button" data-q="下校時刻">下校時刻</button>
      <button type="button" data-q="給食">給食</button>
      <button type="button" data-q="今週の行事">行事</button>
      <button type="button" data-q="掲示板">掲示板</button>
      <button type="button" data-q="ToDo">ToDo</button>
      <button type="button" data-q="メール">メール</button>
      <button type="button" data-q="チャット">チャット</button>
      <button type="button" data-q="更新">更新</button>
    </form>
    <form onsubmit="return false">
      <button type="button" id="bChar">FRIDAYに切り替え</button>
      <button type="button" id="bMute" class="on">声：オン</button>
      <button type="button" id="bHide">中身を隠す：オフ</button>
      <button type="button" data-q="診断">診断</button>
      <select id="selVoice" aria-label="声の選択"></select>
      <span id="hint">パネルをタップすると、大きく開きます</span>
    </form>
  </footer>
</div>

<script>
(function () {
  var THEMES = {
    jarvis: { name: 'J.A.R.V.I.S.', short: 'JARVIS', call: 'トニー様', pitch: 0.8 },
    friday: { name: 'F.R.I.D.A.Y.', short: 'FRIDAY', call: 'ボス', pitch: 1.1 }
  };
  var WD = ['日', '月', '火', '水', '木', '金', '土'];
  var $ = function (id) { return document.getElementById(id); };
  var theme = 'jarvis', data = null, inbox = null, hideBody = false, loadErr = '', muted = false, voices = [];
  var DEFAULT_VOICE = 'Chrome OS 日本語 4';
  var bootedAt = Date.now(), lat = [], battery = null, speaking = false;

  function store(k, v) {
    try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; }
  }
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }
  function clear(n) { while (n.firstChild) n.removeChild(n.firstChild); }
  function row(label, text, extraCls) {
    var r = el('div', 'row');
    r.appendChild(el('b', extraCls || '', label));
    r.appendChild(el('span', '', text));
    return r;
  }
  function p2(n) { return (n < 10 ? '0' : '') + n; }

  /* ---------- 見た目・キャラクター ---------- */
  function applyTheme(t) {
    theme = THEMES[t] ? t : 'jarvis';
    document.body.setAttribute('data-char', theme);
    var T = THEMES[theme];
    $('ringName').textContent = T.name;
    $('bootName').textContent = T.name;
    $('bChar').textContent = theme === 'jarvis' ? 'FRIDAYに切り替え' : 'JARVISに切り替え';
    store('jarvis.theme', theme);
  }

  /* ---------- 時刻・文章づくり ---------- */
  function spokenTime(t) {
    var m = /^(\d{1,2}):(\d{2})$/.exec(t || '');
    if (!m) return t || '';
    var h = parseInt(m[1], 10), mi = parseInt(m[2], 10);
    return h + '時' + (mi ? mi + '分' : '');
  }
  function groups(times) {
    var g = [];
    for (var i = 0; i < 6; i++) {
      var t = times[i];
      if (!t) continue;
      var last = g[g.length - 1];
      if (last && last.t === t && last.e === i) { last.e = i + 1; }
      else { g.push({ s: i + 1, e: i + 1, t: t }); }
    }
    return g;
  }
  function gradeLabel(g) {
    if (g.s === 1 && g.e === 6) return '全学年';
    if (g.s === g.e) return g.s + '年';
    if (g.e - g.s === 1) return g.s + '年と' + g.e + '年';
    return g.s + '年から' + g.e + '年';
  }
  function dismissalSpeech(info, dayWord) {
    if (!info) return dayWord + 'の下校時刻は、登録が見つかりません。';
    var g = groups(info.times);

      m.appendChild(el('div', 'muted', f.year + '年度（4月〜3月）の経過'));
    });
    fill('ca', function (b, m) {
      var n = new Date(), s = new Date(n.getFullYear(), n.getMonth(), n.getDate() - n.getDay());
      var w = el('div', 'weekstrip');
      for (var i = 0; i < 7; i++) {
        var d = new Date(s.getFullYear(), s.getMonth(), s.getDate() + i);
        var c = el('div', d.toDateString() === n.toDateString() ? 'today' : '');
        c.appendChild(el('div', 'w', WD[i]));
        c.appendChild(document.createTextNode(String(d.getDate())));
        w.appendChild(c);
      }
      b.appendChild(w);
      var mg = el('div', 'month');
      WD.forEach(function (x) { mg.appendChild(el('div', 'w', x)); });
      var first = new Date(n.getFullYear(), n.getMonth(), 1), last = new Date(n.getFullYear(), n.getMonth() + 1, 0).getDate();
      for (var k = 0; k < first.getDay(); k++) mg.appendChild(el('div'));
      for (var j = 1; j <= last; j++) mg.appendChild(el('div', j === n.getDate() ? 'today' : '', String(j)));
      m.appendChild(el('div', '', (n.getMonth() + 1) + '月'));
      m.appendChild(mg);
    });
  }
  function liveFast() {
    var d = new Date();
    var ck = $('b_ck');
    clear(ck);
    var big = el('div', 'orb');
    big.style.cssText = 'font-size:30px;font-weight:700;color:var(--main);line-height:1';
    big.textContent = p2(d.getHours()) + ':' + p2(d.getMinutes());
    var sm = el('small', '', p2(d.getSeconds()));
    sm.style.cssText = 'font-size:14px;color:var(--muted);margin-left:5px';
    big.appendChild(sm);
    ck.appendChild(big);
    var cm = $('m_ck'); clear(cm);
    cm.appendChild(el('div', 'muted', 'UTC ' + p2(d.getUTCHours()) + ':' + p2(d.getUTCMinutes()) + '　（' + d.toISOString().slice(0, 10) + '）'));

    var dt = $('b_dt'); clear(dt);
    var w = wareki(d);
    var l1 = el('div', '', w); l1.style.cssText = 'font-size:13px;font-weight:700;line-height:1.3';
    dt.appendChild(l1);
    var dm = $('m_dt'); clear(dm);
    var ys = new Date(d.getFullYear(), 0, 1);
    dm.appendChild(el('div', 'muted', '今年の ' + (Math.floor((d - ys) / 86400000) + 1) + ' 日目'));

  }
  function liveSlow() {
    renderDevice();
    if (data) renderNet();
  }

  /* ---------- 会話・声 ---------- */
  function addLog(who, text) {
    var l = $('log');
    var r = el('div', who === 'ai' ? 'ai' : 'you');
    r.appendChild(el('span', 'w', who === 'ai' ? THEMES[theme].short : 'あなた'));
    r.appendChild(el('span', 't', text));
    l.appendChild(r);
    while (l.children.length > 2) l.removeChild(l.firstChild);
  }
  function setState(s) {
    speaking = (s === '応答中');
    $('state').textContent = s;
    $('hud').classList.toggle('speaking', speaking);
    renderDevice();
  }
  function say(text) {
    addLog('ai', text);
    $('talk').textContent = text;
    if (muted || !('speechSynthesis' in window)) return;
    try {
      speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(text);
      u.lang = 'ja-JP';
      var name = $('selVoice').value;
      var v = voices.filter(function (x) { return x.name === name; })[0];
      if (v) u.voice = v;
      u.pitch = THEMES[theme].pitch;
      u.rate = 1.0;
      u.onstart = function () { setState('応答中'); };
      u.onend = u.onerror = function () { setState('待機中'); };
      speechSynthesis.speak(u);
    } catch (e) { setState('待機中'); }
  }
  function loadVoices() {
    if (!('speechSynthesis' in window)) return;
    voices = speechSynthesis.getVoices().filter(function (v) { return /^ja/i.test(v.lang); });
    var sel = $('selVoice'), savedVoice = store('jarvis.voice');
    var names = voices.map(function (v) { return v.name; });
    var pick = names.indexOf(savedVoice) >= 0 ? savedVoice
      : (names.indexOf(DEFAULT_VOICE) >= 0 ? DEFAULT_VOICE : names[0]);
    clear(sel);
    voices.forEach(function (v) {
      var o = el('option', '', v.name.replace('Android Google 音声認識と音声合成サービス ', 'Google '));
      o.value = v.name; sel.appendChild(o);
    });
    if (pick) sel.value = pick;
    renderDevice();
  }

  /* ---------- コマンド（固定パターン） ---------- */
  function reply(q) {
    var s = q.replace(/\s/g, '');
    var call = THEMES[theme].call;
    var mm;
    if (pending) {
      if (Date.now() - pending.at > 120000) { clearPending(); }
      else if (/^(はい|ええ|ok|OK|お願い|実行|いいよ|そうして)/.test(s)) {
        var pd = pending; clearPending();
        return gs('commitNotice', { text: pd.text, offset: pd.offset, md: pd.md }).then(function (r) {
          load(false);
          return r.label + 'の連絡事項に追加しました。取り消すときは「取り消し」と言ってください、' + call + '。';
        }).catch(function (e) { return '書き込めませんでした。' + e.message; });
      }
      else if (/^(いいえ|やめ|キャンセル|中止|違う|ちがう)/.test(s)) { clearPending(); return '取りやめました。'; }
    }
    if (/^(取り消し|取消|元に戻|アンドゥ|undo)/i.test(s)) {
      return gs('undoLast').then(function (r) { load(false); return r; }).catch(function (e) { return '取り消せませんでした。' + e.message; });
    }
    if ((mm = q.trim().match(/^(?:連絡事項|連絡|お知らせ)[\s:：、,]+([\s\S]+)$/))) {
      var pdy = parseDay(mm[1].trim());
      if (!pdy.text.trim()) return '連絡する内容を教えてください、' + call + '。';
      return gs('previewNotice', { text: pdy.text, offset: pdy.offset, md: pdy.md }).then(function (r) {
        pending = { kind: 'notice', text: pdy.text, offset: pdy.offset, md: pdy.md, at: Date.now() };
        return r.label + 'の連絡事項に、「' + pdy.text + '」を追加します。よろしいですか？';
      }).catch(function (e) { return '追加できません。' + e.message; });
    }
    if ((mm = q.trim().match(/^(?:ToDo|todo|TODO|やること|タスク)[\s:：、,]*([\s\S]*)$/i))) {
      var body = mm[1].trim();
      if (!body) {
        if (!todos) return 'ToDoを読み込み中です。';
        var op = todos.filter(function (x) { return !x.done; });
        return op.length ? 'やることは' + op.length + '件です。' + op.slice(0, 5).map(function (x) { return x.title; }).join('。') + '。' : 'やることはありません。';
      }
      var pq = parseDue(body);
      if (!pq.title) return 'ToDoの内容を教えてください。';
      return gs('addTodo', pq.title, pq.due).then(function (r) {
        todos = r; renderTodo();
        return 'ToDoに追加しました。' + pq.title + (pq.due ? '、期限は' + parseInt(pq.due.slice(5, 7), 10) + '月' + parseInt(pq.due.slice(8), 10) + '日です。' : '。');
      }).catch(function (e) { return '追加できませんでした。' + e.message; });
    }
    if (/掲示板|連絡事項|^連絡$/.test(s)) {
      if (!data) return 'データを読み込み中です。';
      if (!data.board) return '掲示板のデータを読めません。';
      var bo = data.board;
      var tx = '本日の連絡事項は' + bo.renraku.length + '件、委員会は' + bo.iinkai.length + '件、学年は' + bo.gakunen.length + '件です。';
      if (bo.renraku.length) tx += bo.renraku.slice(0, 3).join('。') + '。';
      return tx;
    }
    if (/フライデー|FRIDAY/i.test(s)) { applyTheme('friday'); return 'フライデーに切り替えました、ボス。'; }
    if (/ジャービス|JARVIS/i.test(s)) { applyTheme('jarvis'); return 'ジャービスに切り替えました、トニー様。'; }
    if (/診断|状態|接続/.test(s)) {
      var p = [];
      p.push(data ? 'シートの読み込みは完了しています。' : 'シートのデータはまだ読めていません。');
      if (loadErr) p.push('エラーは、' + loadErr + '。');
      if (data && data.error) p.push('シートの問題は、' + data.error + '。');
      p.push('掲示板は' + (data && data.board ? '接続済み' : '未接続') + '、カレンダーは' + (data && data.status.calendar ? '接続済み' : '未接続') + '、天気は' + (data && data.status.weather ? '接続済み' : '未接続') + 'です。');
      p.push('メールは' + (inbox && inbox.mail.ok ? '接続済み' : '未接続') + '、チャットは' + (inbox && inbox.chat.ok ? '接続済み' : '未接続') + 'です。');
      return p.join('');
    }
    if (/年度|進み|何日/.test(s)) {
      var f0 = fiscal(new Date());
      return '今年度は' + f0.pct.toFixed(0) + 'パーセント進みました。三月末まで、あと' + f0.left + '日です。';
    }
    if (/今何時|何時|時刻を|現在時刻/.test(s) && !/下校/.test(s)) {
      var n0 = new Date();
      return '現在、' + n0.getHours() + '時' + n0.getMinutes() + '分です。';
    }
    if (/メール|Gmail|ジーメール/i.test(s)) {
      if (!inbox) return 'メールを確認中です。少々お待ちください。';
      if (!inbox.mail.ok) return 'メールにつながっていません。' + (inbox.mail.err || '');
      var mm = inbox.mail;
      if (/読んで|内容|だれ|誰/.test(s) && !hideBody && mm.items.length) return '未読は' + mm.unread + '件です。' + mm.items.slice(0, 3).map(function (x) { return x.from + 'さんから、' + x.subject; }).join('。') + '。';
      return '未読のメールは' + mm.unread + '件です。';
    }
    if (/チャット|Chat/i.test(s)) {
      if (!inbox) return 'チャットを確認中です。少々お待ちください。';
      if (!inbox.chat.ok) return 'チャットにつながっていません。' + (inbox.chat.err || '');
      var cc = inbox.chat;
      if (!cc.items.length) return 'チャットの新着はありません。';
      if (/読んで|内容|だれ|誰/.test(s) && !hideBody) return 'チャットの新着は' + cc.count + '件です。' + cc.items.slice(0, 3).map(function (x) { return x.room + '、' + x.sender + 'さん、' + x.text; }).join('。') + '。';
      return 'チャットの新着は' + cc.count + '件です。';
    }
    if (!data) return (loadErr ? 'データを読み込めていません。' + loadErr + '。「診断」と言うと状態を確認できます。' : 'データを読み込み中です。少々お待ちください、' + call + '。');
    if (/更新|リロード|最新/.test(s)) { load(true); loadInbox(); return '最新の情報を取得します。'; }
    if (/下校/.test(s)) {
      return /明日/.test(s) ? dismissalSpeech(data.tomorrow, '明日') : dismissalSpeech(data.today, '本日');
    }
    if (/給食|人数/.test(s)) {
      var l = data.lunch;
      if (!l) return '本日は、給食の登録がありません。';
      return '本日の給食は、児童' + l.kids + '人、教職員' + l.adults + '人、合計' + l.meals + '食です。';
    }
    if (/予定|スケジュール/.test(s)) {
      if (!data.calendar.length) return '本日、カレンダーの予定はありません。';
      return '本日の予定は' + data.calendar.length + '件です。' + data.calendar.map(function (e) {
        return (e.time === '終日' ? '終日' : spokenTime(e.time)) + '、' + e.title;
      }).join('。') + '。';
    }
    if (/行事/.test(s)) {
      var td = data.today && data.today.event;
      var parts = [td ? '本日の行事は、' + td + 'です。' : '本日は、特別な行事はありません。'];
      var rest = data.week.filter(function (w) { return !(td && w.event === td && data.week[0] === w); });
      if (rest.length) parts.push('今週は、' + rest.map(function (w) { return w.label + ' ' + w.event; }).join('、') + 'の予定です。');
      return parts.join('');
    }
    if (/出張|年休|職員/.test(s)) {
      return data.staff && data.staff.kinds.length ? '本日は、' + data.staff.kinds.join('、') + 'があります。' : '本日の出張や年休の記載はありません。';
    }
    if (/天気|気温|雨/.test(s)) {
      var w = data.weather;
      return w ? '現在の奈良は' + w.text + '、気温は' + w.temp + '度です。' + (w.pop !== null ? '降水確率は' + w.pop + 'パーセントです。' : '') : '天気を取得できませんでした。';
    }
    if (/時間|時刻/.test(s)) {
      var n = new Date();
      return '現在、' + n.getHours() + '時' + n.getMinutes() + '分です。';
    }
    if (/おはよう|こんにちは|こんばんは|やあ/.test(s)) return timeGreeting() + '、' + call + '。';
    if (/ありがとう/.test(s)) return 'どういたしまして、' + call + '。';
    return 'すみません、' + call + '。その操作はまだ覚えていません。「下校時刻」「給食」「今日の予定」「行事」「天気」「年度」などをお試しください。';
  }
  function ask(text) {
    if (!text) return;
    addLog('you', text);
    var ans;
    try { ans = reply(text); }
    catch (e) { ans = '処理中にエラーが起きました。' + (e && e.message ? e.message : e); }
    Promise.resolve(ans).then(function (t) {
      say(t);
      if (pending) {
        var cf = el('div', 'cf');
        var y = el('button', '', 'はい'), n = el('button', '', 'いいえ');
        y.type = n.type = 'button';
        y.onclick = function () { ask('はい'); };
        n.onclick = function () { ask('いいえ'); };
        cf.appendChild(y); cf.appendChild(n);
        $('talk').appendChild(cf);
      }
    });
  }

  /* ---------- データ読み込み ---------- */
  function load(speakDone) {
    var t0 = performance.now();
    google.script.run
      .withSuccessHandler(function (d) {
        lat.push(Math.round(performance.now() - t0));
        if (lat.length > 12) lat.shift();
        if (!d) { loadErr = 'サーバーから空の応答が返りました'; renderStatus(); say('データを読み込めませんでした。' + loadErr); return; }
        loadErr = '';
        try { render(d); } catch (e) { loadErr = '画面の描画でエラー：' + (e && e.message ? e.message : e); renderStatus(); }
        if (d.error) say('接続に問題があります。' + d.error);
        else if (speakDone === true) say('最新の情報に更新しました。');
      })
      .withFailureHandler(function (e) {
        loadErr = (e && e.message) ? e.message : '不明なエラー';
        renderStatus();
        say('データを読み込めませんでした。' + loadErr);
      })
      .getDashboard();
  }

  function greeting() {
    var call = THEMES[theme].call, d = new Date();
    var s = timeGreeting() + '、' + call + '。' + (d.getMonth() + 1) + '月' + d.getDate() + '日、' + WD[d.getDay()] + '曜日です。';
    if (data && data.today) {
      if (data.today.event) s += '本日の行事は、' + data.today.event + 'です。';
      var g = groups(data.today.times);
      if (g.length) s += '下校は、' + g.map(function (x) { return gradeLabel(x) + spokenTime(x.t); }).join('、') + 'です。';
    }
    return s;
  }

  /* ---------- 起動 ---------- */
  $('bootBtn').onclick = function () {
    $('boot').style.display = 'none';
    bootedAt = Date.now();
    var wait = setInterval(function () {
      if (data) { clearInterval(wait); say(greeting()); }
    }, 200);
    setTimeout(function () { clearInterval(wait); if (!data) say('データの読み込みに時間がかかっています。'); }, 12000);
  };
  $('form').onsubmit = function (e) { e.preventDefault(); var v = $('inp').value.trim(); $('inp').value = ''; ask(v); return false; };
  Array.prototype.forEach.call(document.querySelectorAll('button[data-q]'), function (b) {
    b.onclick = function () { ask(b.getAttribute('data-q')); };
  });
  $('bChar').onclick = function () {
    applyTheme(theme === 'jarvis' ? 'friday' : 'jarvis');
    say(theme === 'jarvis' ? 'ジャービス、起動しました。ご用件をどうぞ、トニー様。' : 'フライデーです。ご用件をどうぞ、ボス。');
  };
  $('bMute').onclick = function () {
    muted = !muted;
    this.textContent = muted ? '声：オフ' : '声：オン';
    this.classList.toggle('on', !muted);
    store('jarvis.muted', muted ? '1' : '0');
    if (muted && 'speechSynthesis' in window) speechSynthesis.cancel();
    renderDevice();
  };
  function applyHide() {
    $('bHide').textContent = '中身を隠す：' + (hideBody ? 'オン' : 'オフ');
    $('bHide').classList.toggle('on', hideBody);
    renderInbox();
  }
  $('bHide').onclick = function () { hideBody = !hideBody; store('jarvis.hide', hideBody ? '1' : '0'); applyHide(); };
  $('inp').addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.isComposing && e.keyCode !== 229) { e.preventDefault(); $('form').onsubmit(e); }
  });
  $('selVoice').onchange = function () {
    store('jarvis.voice', this.value);
    renderDevice();
    say('この声でお話しします。');
  };

  buildPanels();
  hideBody = store('jarvis.hide') === '1'; applyHide();
  applyTheme(store('jarvis.theme') || 'jarvis');
  if (store('jarvis.muted') === '1') { muted = true; $('bMute').textContent = '声：オフ'; $('bMute').classList.remove('on'); }
  if ('speechSynthesis' in window) { loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
  try {
    if (navigator.getBattery) navigator.getBattery().then(function (b) { battery = b; b.onlevelchange = b.onchargingchange = renderDevice; renderDevice(); });
  } catch (e) {}
  window.addEventListener('resize', renderDevice);
  renderDevice(); liveFast();
  setInterval(liveFast, 1000); setInterval(liveSlow, 30000);
  load(false); loadInbox(); loadTodos();
  setInterval(function () { load(false); }, 300000);
  setInterval(loadInbox, 120000);

})();
</script>
</body>
</html>
